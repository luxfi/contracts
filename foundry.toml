# Lux contracts — Foundry config.
#
# Single source of truth for the canonical Solidity helpers that the
# Lux EVM (geth/evm/coreth) exposes to L1 contract authors. These are
# thin wrappers around the native precompiles in luxfi/precompile.

[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.27"
optimizer = true
optimizer_runs = 200
via_ir = false

# evm_version pinned to cancun — same baseline the Lux EVM advertises.
evm_version = "cancun"

# Forbid implicit address-literal-to-uint coercion that older OpenZeppelin
# style allows.
extra_output = ["storageLayout", "metadata"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
